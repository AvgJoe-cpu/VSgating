[project]
name = "vsgating"
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "AvgJoe-cpu", email = "129824187+AvgJoe-cpu@users.noreply.github.com" }
]
requires-python = ">=3.12,<3.13"

dependencies = [
    "accelerate>=1.14.0",
    "datasets>=5.0.1",
    "numpy>=2.5.1",
    "torch>=2.13.0 ; sys_platform == 'darwin'",
    "torch           ; sys_platform == 'linux'",   # no version pin — uv picks what's available
    "transformers>=5.14.1",
    "wandb>=0.28.1",
    "flash-attn>=2.8.3 ; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
environments = [
    "sys_platform == 'darwin'",
    "sys_platform == 'linux'",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'darwin'" },
  # Linux: no index override — resolves from PyPI, compatible with whatever Colab provides
]
flash-attn = [
  # GPU: A100-SXM4-80GB (sm_80), CUDA 13.0 wheel (runs on CUDA 12.8), PyTorch 2.13, Python 3.12
  # release: https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/tag/v0.9.47
  { url = "https://github.com/mjun0812/flash-attention-prebuild-wheels/releases/download/v0.9.47/flash_attn-2.8.3+cu130torch2.13-cp312-cp312-linux_x86_64.whl", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url  = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
vsgating   = "vsgating:main"
gate       = "vsgating.gating:main"
model      = "vsgating.modeling_gating:main"
data       = "vsgating.sample_data:main"
train_ref  = "vsgating.pt_ref:main"
train_gate = "vsgating.pt_gate:main"
train_gate2 = "vsgating.pt_gate_v2:main"